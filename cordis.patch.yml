# dsh-jupyter bundle patch: inserts the dual-face plugin row into the
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:/path/to/dsh-jupyter`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (session-scoped notebook routes + the Python kernel
# bridge), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client") load in the GUI, where it registers the `.ipynb`
# right-sidebar tab type.
- insert:
    - id: dsh-jupyter
      name: '@kikulmj/dsh-jupyter'
