# dsh-jupyter bundle patch: inserts the dual-face plugin row into the web
# profile roster. Applied as a profile bundle layer (the `dsh.bundle.patch`
# manifest field); install with
# `dsh plugin --profile web add link:/home/kiku/dsh-jupyter`.
#
# The row is a bare plugin by package name: the node half (exports ".") runs
# in the host process (workspace-gated notebook fs routes + the Jupyter kernel
# bridge), and the `dsh.client` declaration in package.json makes the browser
# half (exports "./client", served at /plugins/dsh-jupyter/client.js) load
# in the web GUI.
- insert:
    - id: dsh-jupyter
      name: '@dsh-local/dsh-jupyter'
